[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

# Auth server — internal, listens on PDNS_LOCAL_PORT (default 5300).
# Recursor forwards internal zones here; it also serves RPZ from its database.
[program:pdns-authoritative]
command=python3 /usr/local/bin/supervisor_tee.py pdns-authoritative pdns_server --daemon=no
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/pdns-authoritative.log
stdout_logfile_maxbytes=0
priority=10

# Recursor — external entry point for users, listens on port 53.
# Forwards internal zones to auth, external queries to upstream resolvers.
[program:pdns-recursor]
command=python3 /usr/local/bin/supervisor_tee.py pdns-recursor pdns_recursor --daemon=no
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/pdns-recursor.log
stdout_logfile_maxbytes=0
priority=20

# Zone sync — polls auth API every PDNS_SYNC_INTERVAL seconds (default 300),
# regenerates forward-zones.yml and forward-zones-ntas.lua, then signals
# the recursor to reload without restart.
[program:pdns-sync-forward-zones]
command=python3 /usr/local/bin/supervisor_tee.py pdns-sync-forward-zones /usr/local/sbin/pdns-sync-forward-zones-loop
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/pdns-sync-forward-zones.log
stdout_logfile_maxbytes=0
priority=30
