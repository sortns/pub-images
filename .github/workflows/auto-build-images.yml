name: Auto Build Images

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

# Read-only — no commits back to the repo, no branch-protection fights.
permissions:
  contents: read

jobs:
  prepare:
    name: Detect changed images
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.prep.outputs.images }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Detect changed image directories and resolve versions
        id: prep
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os, json, subprocess

          images_dir = 'images'
          before     = os.environ.get('BEFORE', '')
          sha        = os.environ.get('SHA', '')
          run_number = os.environ.get('RUN_NUMBER', '0')

          def git_changed_files(b, s):
              try:
                  out = subprocess.check_output(['git', 'diff', '--name-only', b, s], text=True)
                  return out.splitlines()
              except Exception:
                  try:
                      out = subprocess.check_output(['git', 'diff', '--name-only', 'HEAD~1', 'HEAD'], text=True)
                      return out.splitlines()
                  except Exception:
                      return []

          changed = git_changed_files(before, sha)
          imgs = {}
          for p in changed:
              if not p:
                  continue
              parts = p.split('/')
              if parts[0] == images_dir and len(parts) >= 2:
                  imgs[parts[1]] = True

          images = []
          for name in sorted(imgs.keys()):
              d = os.path.join(images_dir, name)
              if not (os.path.isdir(d) and os.path.exists(os.path.join(d, 'Dockerfile'))):
                  continue
              vf = os.path.join(d, 'VERSION')
              base = '0.0'
              if os.path.exists(vf):
                  raw = open(vf).read().strip()
                  parts = raw.split('.')
                  # Accept x.y or x.y.z — use only major.minor as the base
                  base = f'{parts[0]}.{parts[1]}' if len(parts) >= 2 else raw
              version = f'{base}.{run_number}'
              images.append({'name': name, 'dir': d, 'version': version})

          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              fh.write('images=' + json.dumps(images))

          if images:
              for i in images:
                  print(f"  {i['name']}  →  {i['version']}")
          else:
              print('No image folders changed; nothing to do.')
          PY

  build-images:
    name: Build and push ${{ matrix.name }}:${{ matrix.version }}
    needs: prepare
    runs-on: ubuntu-latest
    if: needs.prepare.outputs.images != '[]' && needs.prepare.outputs.images != ''
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.images) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Validate Docker Hub secrets and set token
        run: |
          if [ -z "${{ secrets.DOCKER_HUB_USER }}" ]; then
            echo "ERROR: DOCKER_HUB_USER secret is not set."
            exit 1
          fi
          if [ -n "${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}" ]; then
            echo "DOCKER_HUB_TOKEN_USED=${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}" >> $GITHUB_ENV
          elif [ -n "${{ secrets.DOCKER_HUB_TOKEN }}" ]; then
            echo "DOCKER_HUB_TOKEN_USED=${{ secrets.DOCKER_HUB_TOKEN }}" >> $GITHUB_ENV
          else
            echo "ERROR: Neither DOCKER_HUB_ACCESS_TOKEN nor DOCKER_HUB_TOKEN is set."
            exit 1
          fi
        shell: bash

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ env.DOCKER_HUB_TOKEN_USED }}

      - name: Build image
        run: |
          docker build "${{ matrix.dir }}" \
            --tag "${{ secrets.DOCKER_HUB_USER }}/${{ matrix.name }}:${{ matrix.version }}" \
            --tag "${{ secrets.DOCKER_HUB_USER }}/${{ matrix.name }}:latest"

      - name: Push image
        if: github.event_name != 'pull_request'
        run: docker push --all-tags "${{ secrets.DOCKER_HUB_USER }}/${{ matrix.name }}"

      - name: Update Docker Hub description
        if: github.event_name != 'pull_request' && hashFiles(format('{0}/README.md', matrix.dir)) != ''
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
          repository: ${{ secrets.DOCKER_HUB_USER }}/${{ matrix.name }}
          readme-filepath: ${{ matrix.dir }}/README.md
          short-description: ${{ github.event.repository.description }}
