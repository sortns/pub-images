name: Auto Build Images

on:
  push:
    branches: [ master ]

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare image list and bump VERSION
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions'
    outputs:
      images: ${{ steps.prep.outputs.images }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Discover changed images and bump VERSION files
        id: prep
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os, json, subprocess

          images_dir = 'images'
          before = os.environ.get('BEFORE')
          sha = os.environ.get('SHA')

          def git_changed_files(b, s):
              try:
                  out = subprocess.check_output(['git', 'diff', '--name-only', b, s], text=True)
                  return out.splitlines()
              except Exception:
                  # fallback to last commit
                  try:
                      out = subprocess.check_output(['git', 'diff', '--name-only', 'HEAD~1', 'HEAD'], text=True)
                      return out.splitlines()
                  except Exception:
                      return []

          changed = git_changed_files(before, sha)
          imgs = {}
          for p in changed:
              if not p:
                  continue
              parts = p.split('/')
              if parts[0] == images_dir and len(parts) >= 2:
                  name = parts[1]
                  imgs[name] = True

          images = []
          for name in sorted(imgs.keys()):
              d = os.path.join(images_dir, name)
              if os.path.isdir(d) and os.path.exists(os.path.join(d, 'Dockerfile')):
                  vf = os.path.join(d, 'VERSION')
                  ver = 0
                  if os.path.exists(vf):
                      try:
                          with open(vf) as f:
                              ver = int(f.read().strip())
                      except Exception:
                          ver = 0
                  newver = ver + 1
                  with open(vf, 'w') as f:
                      f.write(str(newver))
                  images.append({'name': name, 'path': os.path.join(d, 'Dockerfile'), 'version': str(newver), 'tag': 'v'+str(newver)})

          # write output to GITHUB_OUTPUT
          out_lines = []
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('images=' + json.dumps(images))

          # commit VERSION changes if any
          if images:
              files = ' '.join([os.path.join('images', i['name'], 'VERSION') for i in images])
              subprocess.call(['git', 'add'] + [os.path.join('images', i['name'], 'VERSION') for i in images])
              subprocess.call(['git', 'commit', '-m', 'ci: bump image versions [skip ci]'])
              subprocess.call(['git', 'push', 'origin', 'HEAD:master'])
          else:
              print('No image folders changed; nothing to do')
          PY

  build-images:
    name: Build and push images (Docker Hub)
    needs: prepare
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'github-actions' && needs.prepare.outputs.images != '[]' && needs.prepare.outputs.images != '' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.images) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login to Docker Hub
        run: |
          if [ -z "${{ secrets.DOCKER_HUB_USER }}" ] || [ -z "${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}" ]; then
            echo "ERROR: Docker Hub secrets DOCKER_HUB_USER or DOCKER_HUB_ACCESS_TOKEN are not set or empty."
            echo "Please add them to repository Secrets (Settings → Secrets and variables → Actions)."
            exit 1
          fi
        shell: bash

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build image
        run: |
          docker build -f "${{ matrix.path }}" --tag "${{ secrets.DOCKER_HUB_USER }}/${{ matrix.name }}:${{ matrix.tag }}" --tag "${{ secrets.DOCKER_HUB_USER }}/${{ matrix.name }}:${{ matrix.version }}" .

      - name: Push image tag
        run: docker push "${{ secrets.DOCKER_HUB_USER }}/${{ matrix.name }}:${{ matrix.tag }}"

      - name: Push image version
        run: docker push "${{ secrets.DOCKER_HUB_USER }}/${{ matrix.name }}:${{ matrix.version }}"
