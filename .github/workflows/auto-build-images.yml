name: Auto Build Images

on:
  push:
    branches: [ master ]

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare image list and bump VERSION
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions'
    outputs:
      images: ${{ steps.prep.outputs.images }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Discover changed images and bump VERSION files
        id: prep
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os, json, subprocess

          images_dir = 'images'
          before = os.environ.get('BEFORE')
          sha = os.environ.get('SHA')

          def git_changed_files(b, s):
              try:
                  out = subprocess.check_output(['git', 'diff', '--name-only', b, s], text=True)
                  return out.splitlines()
              except Exception:
                  # fallback to last commit
                  try:
                      out = subprocess.check_output(['git', 'diff', '--name-only', 'HEAD~1', 'HEAD'], text=True)
                      return out.splitlines()
                  except Exception:
                      return []

          changed = git_changed_files(before, sha)
          imgs = {}
          for p in changed:
              if not p:
                  continue
              parts = p.split('/')
              if parts[0] == images_dir and len(parts) >= 2:
                  name = parts[1]
                  imgs[name] = True

          images = []
          for name in sorted(imgs.keys()):
              d = os.path.join(images_dir, name)
              if os.path.isdir(d) and os.path.exists(os.path.join(d, 'Dockerfile')):
                  vf = os.path.join(d, 'VERSION')
                  major, minor, patch = 0, 0, 0
                  if os.path.exists(vf):
                      try:
                          with open(vf) as f:
                              parts = f.read().strip().split('.')
                          major, minor, patch = int(parts[0]), int(parts[1]), int(parts[2])
                      except Exception:
                          major, minor, patch = 0, 0, 0
                  patch += 1
                  newver = f'{major}.{minor}.{patch}'
                  with open(vf, 'w') as f:
                      f.write(newver)
                  images.append({'name': name, 'dir': d, 'version': newver})

          # write output to GITHUB_OUTPUT
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('images=' + json.dumps(images))

          # commit VERSION changes if any
          if images:
              subprocess.call(['git', 'add'] + [os.path.join('images', i['name'], 'VERSION') for i in images])
              subprocess.call(['git', 'commit', '-m', 'ci: bump image versions [skip ci]'])
              subprocess.call(['git', 'push', 'origin', 'HEAD:master'])
          else:
              print('No image folders changed; nothing to do')
          PY

  build-images:
    name: Build and push images (Docker Hub)
    needs: prepare
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'github-actions' && needs.prepare.outputs.images != '[]' && needs.prepare.outputs.images != '' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.images) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Docker Hub secrets and set token
        run: |
          # Accept either DOCKER_HUB_ACCESS_TOKEN (new) or DOCKER_HUB_TOKEN (existing)
          if [ -z "${{ secrets.DOCKER_HUB_USER }}" ]; then
            echo "ERROR: Docker Hub secret DOCKER_HUB_USER is not set or empty."
            exit 1
          fi
          if [ -n "${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}" ]; then
            echo "DOCKER_HUB_TOKEN_USED=${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}" >> $GITHUB_ENV
          elif [ -n "${{ secrets.DOCKER_HUB_TOKEN }}" ]; then
            echo "DOCKER_HUB_TOKEN_USED=${{ secrets.DOCKER_HUB_TOKEN }}" >> $GITHUB_ENV
          else
            echo "ERROR: Neither DOCKER_HUB_ACCESS_TOKEN nor DOCKER_HUB_TOKEN is set. Please add one to repository Secrets."
            exit 1
          fi
        shell: bash

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ env.DOCKER_HUB_TOKEN_USED }}

      - name: Build image
        run: |
          docker build "${{ matrix.dir }}" \
            --tag "${{ secrets.DOCKER_HUB_USER }}/${{ matrix.name }}:${{ matrix.version }}" \
            --tag "${{ secrets.DOCKER_HUB_USER }}/${{ matrix.name }}:latest"

      - name: Push image
        run: docker push --all-tags "${{ secrets.DOCKER_HUB_USER }}/${{ matrix.name }}"
